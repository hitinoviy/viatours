<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Viatours</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<nav class="nav">
			<div class="nav__container">
				<div class="nav__content">
					<a class="nav__logo" href="">
						<img src="img/icons/logo.svg" alt="" />
					</a>
					<ul class="nav__links">
						<li><a class="active" href="">Home</a></li>
						<li><a href="">Tour</a></li>
						<li><a href="">Destination</a></li>
						<li><a href="">Activities</a></li>
						<li><a href="">Pages</a></li>
						<li><a href="">Contact</a></li>
					</ul>
				</div>

				<div class="nav__action">
					<span>USD</span>
					<button class="nav__btn">Sign up</button>
					<button class="nav__btn accent-btn">Log in</button>
				</div>
			</div>
		</nav>

		<header class="hero">
			<div class="container">
				<div class="hero__content">
					<h1 class="hero__title">
						Choose a Country For Your <br />
						Next Adventure?
					</h1>
					<div class="hero__search">
						<input
							class="hero__input"
							type="search"
							placeholder="Search destinations"
						/>
						<button class="hero__btn"></button>
					</div>
					<div class="categories">
						<p class="categories__title">Or browse the selected type</p>
						<div class="category__item">Culture</div>
						<div class="category__item">Food</div>
						<div class="category__item">Nature</div>
						<div class="category__item">Adventure</div>
					</div>
				</div>
			</div>
		</header>
	</body>
</html>
